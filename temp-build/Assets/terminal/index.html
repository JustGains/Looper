<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Terminal</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <link rel="stylesheet" href="terminal.css">
    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
</head>
<body>
    <div id="pane"></div>
    <div id="empty" class="empty hidden">
        No terminal.<br>
        <span class="hint">Click + to open one, or hit Ctrl+Shift+T.</span>
        <button id="empty-cta" class="cta">＋ New terminal</button>
        <div id="empty-error" class="empty-error" hidden></div>
    </div>
    <div id="search" class="search hidden" role="search">
        <input id="search-input" type="text" placeholder="Find…" autocomplete="off" spellcheck="false" />
        <span id="search-status" class="status"></span>
        <button id="search-prev" class="iconbtn" title="Previous match (Shift+Enter)">↑</button>
        <button id="search-next" class="iconbtn" title="Next match (Enter)">↓</button>
        <button id="search-close" class="iconbtn" title="Close (Esc)">✕</button>
        <div class="idle-progress"></div>
    </div>
    <script src="terminal.js"></script>
</body>
</html>
